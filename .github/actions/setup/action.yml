name: Setup
description: Install Node, pnpm and the workspace dependencies, and optionally the Rust toolchain.

inputs:
  rust:
    description: Also install Rust, the Tauri system libraries and the cargo cache.
    default: "false"
  rust-components:
    description: Extra rustup components, comma separated.
    default: ""
  save-rust-cache:
    description: Whether this run may save the cargo cache.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        components: ${{ inputs.rust-components }}
    - if: inputs.rust == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: apps/desktop/src-tauri
        save-if: ${{ inputs.save-rust-cache }}
    - shell: bash
      run: pnpm install --frozen-lockfile
