name: Rust

# The frontend job in ci.yml covers the web code; this only runs for the backend.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/**
      - .github/actions/setup/**
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - apps/desktop/src-tauri/**
      - .github/actions/setup/**
      - .github/workflows/rust.yml

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-components: rustfmt, clippy
          # A PR-branch cache is readable only from that branch, so saving one
          # just evicts main's.
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm --filter @artydog/desktop build
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
