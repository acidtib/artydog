name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
