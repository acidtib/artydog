[package]
name = "wardogs-mortar-calculator"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "WARDOGS Mortar Calculator — desktop app with interactive game overlay (Phase 1: overlay architecture proof)"
authors = ["WARDOGS"]

[lib]
name = "wardogs_mortar_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
